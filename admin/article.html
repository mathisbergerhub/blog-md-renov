<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Publier un article | Blog MD Rénov'</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --cream:#f0ece4; --paper:#fffaf3; --ink:#171717; --muted:#69635c; --red:#9b1c1c; --line:#ded6ca; --ok:#1d6b42; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--ink); font-family: Lexend, system-ui, sans-serif; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
    header, .nav, .actions, .result-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    header { margin-bottom: 24px; }
    .brand img { width: 168px; height: auto; display: block; }
    a, button { min-height: 42px; border: 0; border-radius: 999px; padding: 0 16px; font: 800 13px Lexend, sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .nav a, .secondary { border: 1px solid var(--line); background: white; color: var(--ink); }
    .publish { background: var(--red); color: white; box-shadow: 0 16px 34px rgba(155,28,28,.18); }
    .hero { border: 1px solid var(--line); border-radius: 28px; background: rgba(255,250,243,.88); padding: clamp(24px,4vw,42px); box-shadow: 0 20px 60px rgba(23,23,23,.08); margin-bottom: 18px; }
    .eyebrow { color: var(--red); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(38px,6vw,72px); line-height: .96; letter-spacing: -.07em; }
    h2 { margin: 0; font-size: 22px; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    form { display: grid; gap: 16px; border: 1px solid var(--line); border-radius: 28px; background: white; padding: clamp(18px,3vw,28px); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    label { display: grid; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 15px; padding: 14px 15px; background: #fffaf7; color: var(--ink); font: 500 15px Lexend, sans-serif; outline: none; text-transform: none; letter-spacing: 0; }
    textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
    .markdown { min-height: 520px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
    .wide { grid-column: 1 / -1; }
    .hint { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; }
    .status { color: var(--muted); font-size: 14px; font-weight: 700; }
    .status.error { color: var(--red); }
    .status.ok { color: var(--ok); }
    .result { display: none; border: 1px solid rgba(29,107,66,.22); border-radius: 22px; background: #f5fff8; padding: 18px; }
    .result.is-visible { display: grid; gap: 12px; }
    .result a { background: var(--ok); color: white; width: max-content; }
    @media (max-width: 820px) { header { align-items: flex-start; flex-direction: column; } .grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } .actions { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <a class="brand" href="/admin"><img src="../logo-mdr-site.svg" alt="MD Rénov'" /></a>
      <nav class="nav" aria-label="Navigation admin">
        <a href="/admin/manage">Gérer les contenus</a>
        <a href="/admin/brief">Créer un brief</a>
        <a href="/">Voir le blog</a>
      </nav>
    </header>

    <section class="hero">
      <div class="eyebrow">Publication autonome</div>
      <h1>Créer un article prêt à publier.</h1>
      <p>Remplis les champs utiles, ajoute l'image principale et colle le contenu en Markdown. Au clic sur publier, l'article est envoyé dans GitHub, puis Vercel reconstruit le blog.</p>
    </section>

    <form id="article-form">
      <div class="grid">
        <label>Titre de l'article
          <input id="title" name="title" required placeholder="Ex : Fenêtre PVC ou aluminium : que choisir ?" />
        </label>
        <label>Slug URL
          <input id="slug" name="slug" required placeholder="fenetre-pvc-ou-aluminium" />
          <span class="hint">L'adresse finale sera /slug. Ne pas changer après publication sans raison SEO.</span>
        </label>
        <label>Catégorie
          <select id="category" name="category" required>
            <option value="">Choisir...</option>
            <option value="aides">Aides & Subventions</option>
            <option value="fenetres">Fenêtres & Vitrages</option>
            <option value="isolation">Isolation thermique</option>
            <option value="volets-stores">Volets & Stores</option>
            <option value="portes-portails">Portes & Portails</option>
            <option value="exterieur">Aménagements extérieurs</option>
          </select>
        </label>
        <label>Date
          <input id="date" name="date" type="date" required />
        </label>
        <label>Titre SEO
          <input id="seo-title" name="seo_title" placeholder="Optionnel si identique au titre" />
        </label>
        <label>Temps de lecture
          <input id="reading-time" name="reading_time" value="4 min" />
        </label>
        <label class="wide">Description SEO
          <textarea id="description" name="description" required maxlength="180" placeholder="Résumé clair visible dans Google et dans les cartes du blog."></textarea>
        </label>
        <label>Tags
          <input id="tags" name="tags" placeholder="fenêtres, budget, Haute-Savoie" />
        </label>
        <label>Image principale
          <input id="photo" name="photo" type="file" accept="image/png,image/jpeg,image/webp" />
          <span class="hint">PNG, JPG ou WebP. Idéalement moins de 2,5 Mo.</span>
        </label>
        <label class="wide">Texte alternatif image
          <input id="image-alt" name="image_alt" placeholder="Décrire simplement ce que montre l'image." />
        </label>
        <label class="wide">Contenu Markdown
          <textarea id="body" name="body" class="markdown" required placeholder="## Premier intertitre&#10;&#10;Texte de l'article..."></textarea>
        </label>
      </div>
      <div class="actions">
        <button class="publish" id="submit" type="submit">Publier l'article</button>
        <button class="secondary" type="button" id="reset">Réinitialiser</button>
        <span id="status" class="status">Prêt.</span>
      </div>
      <section id="result" class="result" aria-live="polite"></section>
    </form>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const categoryLabels = {
      aides: "Aides & Subventions",
      fenetres: "Fenêtres",
      isolation: "Isolation",
      "volets-stores": "Volets",
      "portes-portails": "Portes & Portails",
      exterieur: "Aménagements extérieurs",
    };
    const form = $("#article-form");
    const title = $("#title");
    const slug = $("#slug");
    const date = $("#date");
    const status = $("#status");
    const result = $("#result");
    const submit = $("#submit");

    function slugify(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 72);
    }

    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = `status ${type}`.trim();
    }

    function readPhoto(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve(null);
        if (file.size > 2500000) return reject(new Error(`La photo ${file.name} dépasse 2,5 Mo.`));
        const reader = new FileReader();
        reader.onload = () => resolve({ name: file.name, type: file.type, dataUrl: reader.result });
        reader.onerror = () => reject(new Error(`Impossible de lire la photo ${file.name}.`));
        reader.readAsDataURL(file);
      });
    }

    title.addEventListener("input", () => {
      if (!slug.dataset.touched) slug.value = slugify(title.value);
      if (!$("#image-alt").value) $("#image-alt").value = title.value;
    });

    slug.addEventListener("input", () => {
      slug.dataset.touched = "true";
      slug.value = slugify(slug.value);
    });

    date.value = new Date().toISOString().slice(0, 10);

    $("#reset").addEventListener("click", () => {
      form.reset();
      date.value = new Date().toISOString().slice(0, 10);
      slug.dataset.touched = "";
      result.classList.remove("is-visible");
      result.innerHTML = "";
      setStatus("Prêt.");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submit.disabled = true;
      result.classList.remove("is-visible");
      result.innerHTML = "";
      setStatus("Publication en cours...");
      try {
        const category = $("#category").value;
        const photo = await readPhoto($("#photo").files[0]);
        const payload = {
          action: "publish_article",
          title: title.value,
          slug: slug.value,
          seo_title: $("#seo-title").value,
          description: $("#description").value,
          category,
          category_label: categoryLabels[category] || "Conseils",
          date: date.value,
          reading_time: $("#reading-time").value,
          tags: $("#tags").value,
          image_alt: $("#image-alt").value,
          body: $("#body").value,
          photo,
        };
        const response = await fetch("/api/manage-content", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Publication impossible.");
        setStatus("Article envoyé. Déploiement en cours ou prêt à partir.", "ok");
        result.classList.add("is-visible");
        const deployMessage = data.deploy && data.deploy.skipped
          ? "Le hook Vercel n'est pas configuré : le déploiement dépend de l'intégration GitHub."
          : "Vercel a reçu la demande de déploiement. Compter environ 1 à 3 minutes.";
        result.innerHTML = `
          <h2>Article publié côté back-office</h2>
          <p>${deployMessage}</p>
          <div class="result-actions">
            <a href="${data.publicUrl}" target="_blank" rel="noreferrer">Ouvrir la page</a>
            ${data.githubUrl ? `<a href="${data.githubUrl}" target="_blank" rel="noreferrer">Voir dans GitHub</a>` : ""}
          </div>
        `;
      } catch (error) {
        setStatus(error.message, "error");
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
